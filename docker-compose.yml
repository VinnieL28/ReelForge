# Local and small-server deployment.
#
#   docker compose up -d --build
#   docker compose logs -f          # the first-run admin password prints here
#
# exports/ and users.json are named volumes so renders and accounts survive
# `docker compose down` and every rebuild.

services:
  reelforge:
    build: .
    image: reelforge:latest
    container_name: reelforge
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - reelforge-exports:/app/exports
      - reelforge-users:/app/userdata
    environment:
      # Keep the user store on the volume rather than in the image layer.
      - REELFORGE_USERS_FILE=/app/userdata/users.json
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

volumes:
  reelforge-exports:
  reelforge-users:
